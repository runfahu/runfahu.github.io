<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runfa Hu - Curriculum Vitae</title>
    <link rel="icon" href="apple.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Lora', 'Georgia', 'Times New Roman', serif;
            color: #333;
            line-height: 1.8;
            background-color: #fff;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            background-color: #003472;
            color: #ffffff;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
        }
        .nav-menu {
            list-style: none;
            flex-grow: 1;
            margin-top: 20px;
        }
        .nav-menu li {
            margin-bottom: 20px;
            position: relative;
        }
        .nav-menu a {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.75);
            transition: color 0.3s;
        }
        .nav-menu li:hover a,
        .nav-menu li:focus-within a {
            color: #ffffff;
        }
        .nav-menu li.active a {
            color: #ffffff;
            font-weight: 600;
        }
        .nav-menu li::before {
            content: "•";
            color: #ffffff;
            position: absolute;
            left: -18px;
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .nav-menu li:hover::before,
        .nav-menu li:focus-within::before,
        .nav-menu li.active::before {
            opacity: 1;
        }
        .footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
        .main-content {
            margin-left: 260px;
            padding: 80px 10%;
            max-width: 1000px;
            width: 100%;
        }
        .section-title {
            font-size: 32px;
            font-weight: 600;
            color: #111;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaeaea;
        }
        .cv-actions {
            margin-bottom: 24px;
        }
        .btn-pdf {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            border: 1px solid #003472;
            border-radius: 4px;
            font-size: 15px;
            color: #003472;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-pdf:hover {
            background-color: #003472;
            color: #ffffff;
        }
        .btn-pdf svg {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }
        .pdf-preview {
            width: 100%;
            height: 900px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
        }
        .pdf-fallback {
            padding: 30px;
            font-size: 16px;
            color: #555;
        }
        .pdf-fallback a {
            color: #003472;
            text-decoration: underline;
        }


        /* Shared desktop identity and mobile navigation. */
        .sidebar {
            overflow-y: auto;
            height: 100vh;
            height: 100dvh;
        }
        .sidebar-brand {
            flex-shrink: 0;
            font-size: 26px;
            font-weight: 600;
            line-height: 1.4;
            color: #fff;
            white-space: nowrap;
        }
        .site-navigation { flex: 1 0 auto; }
        .mobile-header, .menu-toggle, .menu-close, .menu-backdrop { display: none; }
        .menu-toggle, .menu-close {
            width: 44px;
            height: 44px;
            padding: 10px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .menu-toggle svg, .menu-close svg { width: 24px; height: 24px; }
        .menu-toggle:hover, .menu-close:hover { background: rgba(255, 255, 255, 0.1); }
        .sidebar a:focus-visible, .mobile-header a:focus-visible,
        .menu-toggle:focus-visible, .menu-close:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
        .main-content { min-width: 0; }
        @media (max-width: 850px) {
            .container { flex-direction: column; }
            .mobile-header {
                display: flex;
                align-items: center;
                gap: 10px;
                position: sticky;
                top: 0;
                z-index: 1000;
                min-height: 64px;
                padding: 10px 20px;
                padding-top: max(10px, env(safe-area-inset-top));
                padding-left: max(20px, env(safe-area-inset-left));
                background: #003472;
                color: #fff;
            }
            .mobile-brand {
                font-size: 22px;
                font-weight: 600;
                line-height: 1.4;
                white-space: nowrap;
            }
            .menu-toggle, .menu-close { display: inline-flex; flex-shrink: 0; }
            .menu-close { position: absolute; top: 22px; right: 16px; }
            .sidebar {
                z-index: 1100;
                width: min(300px, 84vw);
                padding: 30px 32px;
                padding-top: max(30px, env(safe-area-inset-top));
                padding-bottom: max(28px, env(safe-area-inset-bottom));
                transform: translateX(-100%);
                visibility: hidden;
                transition: transform 300ms cubic-bezier(0.22, 0.61, 0.36, 1), visibility 0s 300ms;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }
            .sidebar-brand { font-size: 24px; padding-right: 36px; }
            .nav-menu { margin-top: 28px; }
            .nav-menu li { margin-bottom: 8px; }
            .nav-menu a { display: block; padding: 8px 0; font-size: 18px; }
            .footer { margin-top: 36px; flex-shrink: 0; }
            .menu-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 1050;
                background: rgba(0, 0, 0, 0.46);
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 300ms ease, visibility 0s 300ms;
            }
            body.menu-open .sidebar {
                transform: translateX(0);
                visibility: visible;
                box-shadow: 8px 0 30px rgba(0, 0, 0, 0.15);
                transition-delay: 0s;
            }
            body.menu-open .menu-backdrop {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transition-delay: 0s;
            }
            body.menu-open { position: fixed; width: 100%; overflow: hidden; }
            .main-content { margin-left: 0; padding: 40px 6%; }
            .profile-header { flex-direction: column; text-align: center; gap: 20px; }
            .pdf-preview { height: 70vh; min-height: 520px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .sidebar, .menu-backdrop { transition: none; }
        }
    </style>
    <noscript><style>
        @media (max-width: 850px) {
            .menu-toggle, .menu-close { display: none; }
            .sidebar { position: relative; width: 100%; height: auto; transform: none; visibility: visible; }
            .sidebar-brand, .sidebar .footer { display: none; }
            .nav-menu { margin-top: 0; }
        }
    </style></noscript>

    <!-- Gentle content transitions; each page remains a standalone HTML file. -->
    <script>
        (() => {
            const nativeMotion = 'CSSViewTransitionRule' in window &&
                'onpagereveal' in window && /^https?:$/.test(location.protocol);
            document.documentElement.dataset.pageMotion = nativeMotion ? 'native' : 'fallback';
        })();
    </script>
    <style id="page-transitions">
        @view-transition { navigation: auto; }

        /* Keep the blue navigation still; animate only the reading area. */
        :root { view-transition-name: none; }
        .main-content { view-transition-name: page-content; }
        ::view-transition { pointer-events: none; }
        ::view-transition-group(page-content) { animation: none; }
        ::view-transition-image-pair(page-content) { isolation: isolate; }
        ::view-transition-old(page-content),
        ::view-transition-new(page-content) {
            height: auto;
            mix-blend-mode: normal;
            object-position: top left;
        }
        ::view-transition-old(page-content) {
            animation: content-leave 130ms cubic-bezier(.4, 0, 1, 1) both;
        }
        ::view-transition-new(page-content) {
            animation: content-enter 320ms cubic-bezier(.22, 1, .36, 1) 60ms both;
        }
        @keyframes content-enter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes content-leave {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-4px); }
        }

        /* Also works when these files are opened directly from disk. */
        html[data-page-motion="fallback"] .main-content {
            animation: content-enter 320ms cubic-bezier(.22, 1, .36, 1) both;
        }
        html[data-page-motion="fallback"].page-leaving .main-content {
            animation: content-leave 130ms cubic-bezier(.4, 0, 1, 1) both;
        }
        html.page-restored .main-content { animation: none; }

        @media (prefers-reduced-motion: reduce) {
            @view-transition { navigation: none; }
            .main-content { view-transition-name: none; }
            html[data-page-motion] .main-content { animation: none; }
            ::view-transition-group(page-content),
            ::view-transition-old(page-content),
            ::view-transition-new(page-content) { animation: none; }
        }
    </style>
</head>

<body>

<header class="mobile-header">
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="site-sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
    </button>
    <a class="mobile-brand" href="index.html">Runfa Hu</a>
</header>
<div class="menu-backdrop" aria-hidden="true"></div>

<div class="container">
    <aside class="sidebar" id="site-sidebar" aria-label="Site menu">
        <a class="sidebar-brand" href="index.html">Runfa Hu</a>
        <button class="menu-close" type="button" aria-label="Close menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <nav class="site-navigation" aria-label="Primary navigation">
        <ul class="nav-menu">
            <li><a href="index.html">About</a></li>
            <li><a href="publications.html">Publications</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="personal.html">Personal</a></li>
            <li class="active"><a href="cv.html" aria-current="page">Curriculum Vitae</a></li>
        </ul>
        </nav>

        <div class="footer">
            <p>&copy; 2026 Runfa Hu.</p>
            <p>All rights reserved.</p>
        </div>
    </aside>

    <main class="main-content">
        <section id="cv">
            <h2 class="section-title">Curriculum Vitae</h2>

            <div class="cv-actions">
                <a href="cv.pdf" download class="btn-pdf">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Download PDF
                </a>
            </div>

            <object class="pdf-preview" data="cv.pdf#view=FitH" type="application/pdf">
                <div class="pdf-fallback">
                    <p>Your browser cannot display the PDF preview.</p>
                    <p><a href="cv.pdf" target="_blank" rel="noopener noreferrer">Open the curriculum vitae in a new tab</a>.</p>
                </div>
            </object>
        </section>
    </main>
</div>

<script>
    (() => {
        const sidebar = document.getElementById('site-sidebar');
        const toggle = document.querySelector('.menu-toggle');
        const closeButton = document.querySelector('.menu-close');
        const backdrop = document.querySelector('.menu-backdrop');
        const header = document.querySelector('.mobile-header');
        const main = document.querySelector('.main-content');
        const mobile = window.matchMedia('(max-width: 850px)');
        let isOpen = false;
        let scrollPosition = 0;

        function setMenu(open, restoreFocus = true) {
            open = open && mobile.matches;
            const wasOpen = isOpen;
            if (open && !wasOpen) {
                scrollPosition = window.scrollY;
                document.body.style.top = '-' + scrollPosition + 'px';
            }
            isOpen = open;
            document.body.classList.toggle('menu-open', open);
            toggle.setAttribute('aria-expanded', String(open));
            toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
            main.inert = open;
            header.inert = open;
            sidebar.inert = mobile.matches && !open;
            if (open) {
                sidebar.removeAttribute('aria-hidden');
                sidebar.setAttribute('role', 'dialog');
                sidebar.setAttribute('aria-modal', 'true');
                closeButton.focus({preventScroll: true});
            } else {
                sidebar.removeAttribute('role');
                sidebar.removeAttribute('aria-modal');
                if (wasOpen) {
                    document.body.style.top = '';
                    window.scrollTo({top: scrollPosition, left: 0, behavior: 'instant'});
                    if (restoreFocus) {
                        const target = mobile.matches ? toggle : sidebar.querySelector('.nav-menu .active a');
                        target?.focus({preventScroll: true});
                    }
                }
                if (mobile.matches) sidebar.setAttribute('aria-hidden', 'true');
                else sidebar.removeAttribute('aria-hidden');
            }
        }

        toggle.addEventListener('click', () => setMenu(!isOpen));
        closeButton.addEventListener('click', () => setMenu(false));
        backdrop.addEventListener('click', () => setMenu(false));
        sidebar.addEventListener('click', (event) => {
            if (event.target.closest('a') && isOpen) setMenu(false);
        });
        document.addEventListener('keydown', (event) => {
            if (!isOpen) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                setMenu(false);
            } else if (event.key === 'Tab') {
                const focusable = Array.from(sidebar.querySelectorAll('a[href], button:not([disabled])'));
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });

        // Preserve ordinary links, downloads, new tabs, and browser history.
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const root = document.documentElement;
        let navigationTimer = 0;
        let recoveryTimer = 0;
        let navigating = false;

        function resetPageMotion() {
            clearTimeout(navigationTimer);
            clearTimeout(recoveryTimer);
            navigating = false;
            root.classList.remove('page-leaving');
        }

        document.addEventListener('click', (event) => {
            if (event.defaultPrevented || event.button !== 0 ||
                event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            const link = event.target.closest('.nav-menu a, .sidebar-brand, .mobile-brand');
            if (!link || link.hasAttribute('download') ||
                (link.target && link.target !== '_self')) return;
            const target = new URL(link.href, location.href);
            if (target.origin !== location.origin || target.protocol !== location.protocol ||
                target.search || target.hash ||
                !/\/(index|publications|notes|personal|cv)\.html$/.test(target.pathname)) return;

            const currentLink = document.querySelector('.nav-menu a[aria-current="page"]');
            if (target.href === location.href || target.href === currentLink?.href) {
                event.preventDefault();
                resetPageMotion();
                setMenu(false);
                return;
            }

            const closeDrawer = isOpen;
            const fallback = root.dataset.pageMotion === 'fallback' && !reducedMotion.matches;
            // Native desktop transitions need no delay or navigation interception.
            if (!fallback && (!closeDrawer || reducedMotion.matches)) return;
            event.preventDefault();
            if (navigating) return;
            navigating = true;
            setMenu(false);

            const leave = () => {
                if (fallback && !reducedMotion.matches) {
                    root.classList.remove('page-restored');
                    root.classList.add('page-leaving');
                    navigationTimer = setTimeout(() => location.assign(target.href), 130);
                } else {
                    location.assign(target.href);
                }
                // A cancelled or slow navigation must never leave the page invisible.
                recoveryTimer = setTimeout(() => {
                    resetPageMotion();
                    root.classList.add('page-restored');
                }, 1500);
            };
            if (closeDrawer && !reducedMotion.matches) {
                // Let the existing mobile drawer settle before capturing the page.
                navigationTimer = setTimeout(leave, 300);
            } else leave();
        }, true);

        window.addEventListener('pageshow', (event) => {
            resetPageMotion();
            if (event.persisted) root.classList.add('page-restored');
        });
        window.addEventListener('pagehide', resetPageMotion);
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && navigating) {
                resetPageMotion();
                root.classList.add('page-restored');
            }
        });

        mobile.addEventListener('change', () => setMenu(false));
        window.addEventListener('pageshow', () => setMenu(false));
        setMenu(false, false);
    })();
</script>

</body>
</html>
