<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runfa Hu - Curriculum Vitae</title>
    <link rel="icon" href="apple.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Lora', 'Georgia', 'Times New Roman', serif;
            color: #333;
            line-height: 1.8;
            background-color: #fff;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            background-color: #003472;
            color: #ffffff;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
        }
        .nav-menu {
            list-style: none;
            flex-grow: 1;
            margin-top: 20px;
        }
        .nav-menu li {
            margin-bottom: 20px;
            position: relative;
        }
        .nav-menu a {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.75);
            transition: color 0.3s;
        }
        .nav-menu a:hover {
            color: #ffffff;
        }
        .nav-menu li.active a {
            color: #ffffff;
            font-weight: 600;
        }
        .nav-menu li.active::before {
            content: "•";
            color: #ffffff;
            position: absolute;
            left: -18px;
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
            font-size: 18px;
        }
        .footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
        .main-content {
            margin-left: 260px;
            padding: 80px 10%;
            max-width: 1000px;
            width: 100%;
        }
        .section-title {
            font-size: 32px;
            font-weight: 600;
            color: #111;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaeaea;
        }
        .cv-actions {
            margin-bottom: 24px;
        }
        .btn-pdf {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            border: 1px solid #003472;
            border-radius: 4px;
            font-size: 15px;
            color: #003472;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-pdf:hover {
            background-color: #003472;
            color: #ffffff;
        }
        .btn-pdf svg {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }
        .pdf-preview {
            width: 100%;
            height: 900px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
        }
        .pdf-fallback {
            padding: 30px;
            font-size: 16px;
            color: #555;
        }
        .pdf-fallback a {
            color: #003472;
            text-decoration: underline;
        }
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                padding: 20px 30px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .nav-menu {
                display: flex;
                flex-wrap: wrap;
                margin-top: 0;
                gap: 20px;
            }
            .nav-menu li {
                margin-bottom: 0;
            }
            .nav-menu li.active::before {
                display: none;
            }
            .footer {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 40px 6%;
            }
            .pdf-preview {
                height: 70vh;
                min-height: 520px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <aside class="sidebar">
        <ul class="nav-menu">
            <li><a href="index.html">About</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li class="active"><a href="cv.html">Curriculum Vitae</a></li>
        </ul>

        <div class="footer">
            <p>&copy; 2026 Runfa Hu.</p>
            <p>All rights reserved.</p>
        </div>
    </aside>

    <main class="main-content">
        <section id="cv">
            <h2 class="section-title">Curriculum Vitae</h2>

            <div class="cv-actions">
                <a href="cv.pdf" download class="btn-pdf">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Download PDF
                </a>
            </div>

            <object class="pdf-preview" data="cv.pdf#view=FitH" type="application/pdf">
                <div class="pdf-fallback">
                    <p>Your browser cannot display the PDF preview.</p>
                    <p><a href="cv.pdf" target="_blank" rel="noopener noreferrer">Open the curriculum vitae in a new tab</a>.</p>
                </div>
            </object>
        </section>
    </main>
</div>

</body>
</html>
